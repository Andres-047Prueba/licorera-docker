# Uso:  cd jenkins  y luego  docker compose up -d --build
services:
  jenkins:
    build: .
    image: licorera-jenkins:1.0
    container_name: jenkins

    user: root
    restart: unless-stopped
    ports:
      - "8081:8080"   
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: America/Bogota

volumes:
  jenkins_home:
